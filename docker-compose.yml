version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    env_file: .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  mlflow:
    image: python:3.10-slim
    command: >
      bash -c "pip install 'setuptools<81' 'sqlalchemy<2.1' mlflow==2.13.2 --quiet &&
               mlflow server --backend-store-uri sqlite:///mlruns/mlflow.db
               --default-artifact-root ./mlruns
               --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
